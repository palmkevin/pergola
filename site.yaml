# =============================================================================
#  Pergola site definition  —  the ONE source of truth for all drawings.
#
#  Edit the numbers below (or just tell Claude Code the measurements and it
#  will edit them for you), then run ./run.sh to regenerate every view.
#
#  Coordinate system (looking down at your garden from above):
#    x  = left  -> right   (width)
#    y  = front -> back     (depth, "back" = toward the house if attached)
#    z  = ground -> sky     (height)
#  All values are in the unit given by `units` (mm by default).
# =============================================================================

units: mm

site:
  north_deg: 0          # compass bearing of +y, for the North arrow on the plan

pergola:
  type: attached        # "attached" (against a wall) or "freestanding"
  origin: [0, 525]      # near-left (min x, min y) corner of the footprint. y starts
                        # at the FRONT roof edge (= the front beam's outer face), since
                        # the roof no longer overhangs the posts (see footprint.depth).
  footprint:
    width: 2400         # x extent  (240 cm, along the house wall) = post-to-post outer
                        # span (posts sit flush at the side edges, so NO side overhang)
    depth: 2075         # y extent: front roof edge (= front beam) .. house wall (207.5 cm,
                        # away from the house). The roof itself does NOT span this whole
                        # depth — it now STOPS 29.5 cm in front of the wall: the pergola was
                        # pulled off the wall so its house-side roof edge lands exactly at
                        # the bracket that carries the garden-house's upper grey fascia board
                        # (so that bracket can stay as-is). The house-side post row therefore
                        # stands on its own dug footing in the ground (like the front row),
                        # NOT on the old foundation step. This depth is kept TO the wall so
                        # the slope/clear_height reference (y = 2600, the wall) is unchanged.
                        # (Front edge fixed at y = 525, so the roof depth is now 1780 mm.)
  clear_height: 2220    # underside of the roof on the HIGH (house) side. Sized so the
                        # roof's HIGHEST point = exactly 232 cm including the covering
                        # (was 222 cm = the old garden-house gutter/lower-board underside;
                        # removing that lower board frees 10 cm up to the upper board). That
                        # highest point is the panel back (house-side) edge at roof_y1 =
                        # 2305 mm, i.e. 29.5 cm IN FRONT of the wall, so the slope drop from
                        # the clear_height reference (the wall, y = 2600) to that edge is
                        # (2600-2305)*tan(5deg) ~ 25.8 mm:
                        # 2220 + beam 120 + panel 6 - 25.8 = 2320 mm (232.0 cm).
                        # Recompute this whenever roof.tilt_deg or roof.thickness change.
  framing: flush        # "flush" = one-level roof: a perimeter beam ring with the
                        # rafters housed flush BETWEEN the front/back beams (tops
                        # aligned), so the roof is a single plane (no stacked layer).
                        # "stacked" = classic rafters-on-top-of-beams.

  posts:
    # Available timber: 80 x 60 mm. Posts carry mostly axial load (tiny here), so
    # the smaller section is fine; the corner braces below (pergola.braces) take
    # the lateral sway — without them the pin-jointed frame would rack.
    # ORIENTATION: 60 mm along the wall (x), 80 mm front-back (y, AWAY from the
    # house). The 80 face points front-back so the U-anchor bolts are reachable
    # (on the house-side corner the left side is blocked by a wall) and the
    # anchor's gap runs across that 80 face (milled 80->71). See
    # "Pfosten-Verankerung".
    size: [60, 80]      # cross-section [x, y]: 60 along wall (x), 80 front-back (y)
    count_x: 2          # 2 x 2 = 4 posts
    count_y: 2
    # In x (along the wall) the posts sit at the very edges: their outer faces are
    # flush with the roof's side edges, so there is NO side overhang (the roof
    # width = the post-to-post outer span = 240 cm). In y there is now NO overhang
    # either: the roof ends right over each beam (front and house side). Post-row
    # centres from the house wall: house side 335 mm (its roof edge then lands at
    # 295 mm = 29.5 cm from the wall, at the upper-fascia bracket), front row
    # 2035 mm. Centre-to-centre is 1700 mm, so with an 80 mm deep post the CLEAR
    # inner gap between the rows in y is 1700 - 80 = 1620 mm (162.0 cm). (The
    # front/back beams, 80 mm in y, sit flush on the 80 mm post depth; the side
    # beams overhang the 60 mm post width by 10 mm each side — unavoidable with a
    # rectangular post.)
    rows_y_from_wall: [335, 2035]   # post-row centre distances from the house wall
    footing:
      # Square concrete pier under each post — BOTH rows now, since the house-side
      # row stands in the ground 29.5 cm off the wall (no longer on a foundation step
      # against the wall). DIMENSIONING (frost is NOT the driver here — these are
      # not buried to the 80 cm frost line; the piers pour monolithic up to slab
      # level and the timber stays clear of the ground via the U-anchor air gap):
      #  - Bearing/Druck is irrelevant: each post carries only ~1 kN, any size holds.
      #  - The governing load is WIND UPLIFT/Sog on the light mono-pitch roof
      #    (~0.85 kN/post) plus overturning — resisted by the pier MASS and, mostly,
      #    by the whole braced frame acting as one rigid box over its 2.4 x 1.7 m
      #    footprint (one corner down, the opposite up), not by each pier alone.
      #  - DEPTH gives mass + the anti-tip lever arm AND must house the ~200 mm
      #    cast-in ribbed anchor rod with cover below it -> ~300 mm is the hard floor,
      #    450 mm a solid, low-reserve-but-adequate choice (~97 kg/pier).
      #  - SIZE (plan) is set by concrete cover around the anchor: 80 mm post + ~2x50 mm
      #    cover -> ~180-200 mm minimum; 250 mm is comfortable. (Was 300 x 600 mm,
      #    robust but generous; trimmed to save concrete/excavation.)
      size: 250         # 25 x 25 cm pier (cover around the 80 mm post + cast-in rod)
      depth: 450        # 45 cm: anchor-rod embedment + uplift mass + anti-tip lever
    # Pfosten-Verankerung: verzinkter U-Stützenfuß (Alberts, zum Einbetonieren)
    # unter JEDEM Pfosten. Real ein 71-mm-U mit gerippter Betonier-Rundstange
    # (~16 mm / 200 mm), in den Beton gegossen; CE ETA-10/0210. Der 80-mm-Pfosten
    # ist Sondermaß -> an zwei gegenüberliegenden Flächen je ~4,5 mm einfräsen
    # (80 -> 71), dann sitzt der 71er-U satt und FLUSH (Außenmaß bleibt 80); die
    # 60-mm-Wangen decken die 60-mm-Seite exakt ab. Falz nach unten offen lassen
    # (Drainage), Frässtellen imprägnieren. Der Pfosten steht `air_gap` ÜBER dem
    # Beton (Distanzscheiben/EPDM unter dem Hirnholz; der U ist vorne/hinten offen,
    # Wasser läuft seitlich ab — dieser U hat KEIN Ablaufloch). Im Modell als ein
    # Stahl-„Schuh" je Pfosten dargestellt (zählt in der Materialliste als Stück);
    # die Rippstange + ihr Beton stecken im `footing` bzw. der hausseitigen Auflage
    # und werden nicht separat gezeichnet. Volle Einbau-Doku: CLAUDE.md
    # "Pfosten-Verankerung". Kurz:
    #  - Hausgegenseite (vordere Reihe): Boden = 3 cm Terrassenplatten auf
    #    Splittbett. Fundament je Pfosten MONOLITHISCH bis Plattenoberkante
    #    hochziehen (Pfeiler >= ~15 cm für Betondeckung der Stange), Platten
    #    ringsum mit 5-10 mm Spalt ausschneiden.
    #  - Hausseite: die Pergola steht jetzt 29,5 cm von der Wand weg, die hausseitige
    #    Pfostenreihe also ~33,5 cm (Pfostenmitte) vor der Wand IM BODEN — KEINE Stufe
    #    mehr. Fundament wie vorne: Pfeiler monolithisch bis Plattenoberkante gießen
    #    (>= ~15 cm für Betondeckung der Stange). Der Pfosten landet damit etwa im
    #    bestehenden Kies-Drainagestreifen / hinter dem 6-cm-Bordstein: Kies dort
    #    ~20 cm tief ausheben und den Beton an Bordstein UND Gartenhaus-Fundament
    #    anbinden, Drainage erhalten. (Links sichert zusätzlich die kniehohe
    #    Betonsteinmauer den Pfostenfuß — siehe braces.)
    #  - AUSRICHTUNG: alle Pfosten 80-mm-Seite FRONT-BACK (vom Haus weg), 60 mm
    #    entlang der Wand (siehe `size` oben) -> Bolzen vorne/hinten erreichbar
    #    (hausseitiger Eckpfosten: links blockiert die Mauer). Der Anker-Spalt
    #    läuft automatisch über die breitere (gefräste) Pfostenseite, hier y.
    anchor:
      width: 71         # U-Spalt = auf 71 gefräste (breite) Pfostenseite
      wing_depth: 60    # Wangentiefe entlang der anderen (60-mm-)Pfostenseite
      wing_height: 150  # wie weit die Wangen am Pfosten hochreichen
      plate: 4          # Blechdicke
      air_gap: 10       # Pfosten steht 10 mm über dem Beton (Belüftung)
      material: Stahl, verzinkt

  beams:                # the perimeter frame ring (flush framing builds all 4 sides)
    # Available timber: 120 x 80 mm, set on edge (120 = height) for stiffness — the
    # bending-critical members, so the bigger section goes here.
    width: 80
    height: 120
    direction: x        # (ignored when framing: flush — the full ring is built)

  rafters:              # housed flush between the front/back beams, follow the slope
    # Available timber: 80 x 60 mm, on edge (80 = height).
    width: 60
    height: 80
    spacing: 660        # target clear field — used ONLY when the roof is not
                        # panelised. Here roof.panel_width is set, so the rafters are
                        # placed UNDER the panel joints instead (x = 800 and 1600): 2
                        # interior rafters, 3 fields of 800 mm. Each panel edge then
                        # rests on a support and each joint is carried by a rafter. The
                        # clear field (~690-740 mm) stays within a 6 mm solid PVC
                        # sheet's allowable support spacing (~900 mm).
    direction: y        # rafters span along y (down the slope)

  roof:
    kind: glass         # rigid translucent panel representation (here: a SOLID sheet)
    thickness: 6        # massive Polycarbonat-Platte (solid PC sheet, 6 mm), glasklar.
                        # A SOLID (compact) sheet, NOT a twin-wall/Hohlkammer panel — the
                        # glass-like look we want, but tougher and UV-stabler than solid
                        # PVC (which DIY stores don't stock flat/clear anyway). 6 mm spans
                        # the ~740 mm rafter field with ease (solid sheets allow ~900 mm).
    material: Polycarbonat (massiv)   # cover material, shown in the Materialliste. Buy as
                        # 6 mm glasklare PC-Massivplatte, cut to 800 x ~1837 (Bauhaus
                        # Zuschnitt or a plastics cut-to-size shop). The ~1837 is the
                        # slope length: 1780 mm horizontal roof depth + 50 mm front
                        # overhang (front_overhang below) -> 1830 mm horizontal, / cos 5deg.
    # Panelise the cover into equal panels ~this wide across x. 2400 / 800 = 3
    # equal panels of exactly 800 mm; the 2 interior joints (x = 800 and 1600)
    # each land on a rafter (build.py places the rafters under the joints) and are
    # closed with the H-Profil below. This matches off-the-shelf 800-mm-wide sheet
    # widths so a joint never floats between supports. Remove to get one panel.
    panel_width: 800
    join_profile:       # connecting H-Profil over each interior panel joint
      width: 50         # profile width across x (straddles the joint, screwed to the rafter)
      material: Aluminium   # alu glazing bar (standard for solid sheets; could be PVC)
    edge_profile:       # closure profile along the two SIDE edges (left/right), clamping
                        # each outer panel edge onto the side beam. The front edge drains
                        # into the gutter and the house edge is a wall flashing, so only
                        # the two longitudinal sides get one. (Solid sheets need NO open-
                        # chamber U-profiles — there are no chambers, unlike Hohlkammer.)
      width: 40         # profile width across x at each side edge
      material: Aluminium
    # THERMAL EXPANSION (not a geometry change, a fitting detail): solid PC moves
    # ~0.065 mm/m/K — about 4 mm across each 800 mm panel and ~9 mm over the 1.92 m
    # length across a ~75 K summer/winter swing. The 3 x 800 = 2400 here is the COLD
    # nominal (= structure width); the play lives in the profiles, NOT the panel
    # widths: use oversized screw holes (+3-4 mm) with EPDM washers, don't push the
    # panels fully home in the profile channels (~3-5 mm/m gap), and let the eave
    # oversail freely into the gutter. Often the panels are ordered ~3-5 mm under
    # 800 so the gap is guaranteed; the profiles cover it.
    tilt_deg: 5         # pitch: slopes DOWN toward the front, to shed rain/snow. 5 deg
                        # is the practical MINIMUM for solid PVC/PC/acrylic panels
                        # (manufacturers: >=5 deg ~ 9 %; 7-15 deg gives better self-
                        # cleaning/drainage). Do NOT go below 5 deg with a solid panel:
                        # standing water, dirt and leak risk. (Was 6 deg.)
    gutter: true        # rain gutter along the low (front, house-away) eave
    front_overhang: 50  # the PC panels oversail the front beam by 5 cm so the drip
                        # line falls INTO the gutter trough (trough y 405..525, the
                        # panel front edge moves from y 525 to 475, ~centred over the
                        # trough) instead of on its rear lip. Lengthens each panel by
                        # 50/cos5deg ~ 50 mm along the slope. Only the cover (panels +
                        # H-/edge profiles) overhangs; the beams/rafters/gutter stay put.
    # The fields below only apply to louvered/slatted roofs:
    slat:
      width: 80
      height: 20
    spacing: 100        # centre-to-centre between slats
    direction: x        # slats span along x

  # Eckstreben / Kopfbänder zur Aussteifung. Der reine Pfosten-Riegel-Rahmen ist
  # gelenkig und würde unter Wind seitlich schwanken (racking) — die Streben
  # triangulieren die Ecken und machen ihn standsicher. Jede äußere Eckstütze
  # bekommt je Richtung eine 45°-Strebe vom Pfosten hoch zur Balkenunterkante.
  #   directions: [x] -> Streben in x-z-Ebenen (gegen Schwanken PARALLEL zur Wand)
  #   directions: [y] -> Streben in y-z-Ebenen (gegen Schwanken ZUR/VON der Wand)
  # Beide Richtungen = allseitig ausgesteift (empfohlen, solange die Hausseite
  # nicht fest mit der Wand verschraubt ist).
  braces:
    size: 60            # quadratischer Querschnitt der Strebe (mm)
    length: 400         # 45°-Schenkellänge (am Pfosten herunter = am Balken entlang)
    directions: [x, y]  # in beiden vertikalen Ebenen aussteifen
    # Seitenweise Feinauswahl, WELCHE Ebenen wirklich eine Strebe bekommen:
    #   x_sides -> x-z-Ebenen: front (haus­abgewandt) / house (Hausseite)
    #   y_sides -> y-z-Ebenen: left / right
    # Hier sind die quer über die FRONT laufenden x-Diagonalen bewusst weggelassen
    # (offene Frontöffnung). Die Aussteifung übernehmen statt dessen: hausseitig
    # die x-Streben, seitlich (links UND rechts, auch vorne) die y-Streben, und an
    # der Wegseite (links) zusätzlich die Fußbefestigung der Pfosten an der kniehohen
    # Betonsteinmauer. So bleibt der Rahmen gegen Schwanken gesichert, ohne dass
    # Diagonalen die Frontöffnung verstellen.
    x_sides: [house]       # x-Diagonalen NUR hausseitig (front bleibt frei)
    y_sides: [left, right] # y-Streben auf beiden Seiten (sichern u.a. vordere Ecken)

  # Stoffgardinen an den beiden Seiten (links & rechts). Jede Seite bekommt eine
  # Gardinenstange, die zwischen ihren beiden Eckpfosten gespannt und an ihnen
  # befestigt ist; daran hängt eine Stoffbahn bis kurz über den Boden.
  curtains:
    sides: [left, right]   # Seiten mit Gardine (left/right/front/back möglich)
    rod_diameter: 30       # Querschnitt der Gardinenstange (mm, quadratisch)
    fabric_thickness: 30   # dargestellte Stoffdicke (mm)
    top_gap: 80            # Stangenmitte unter der Balkenunterkante (mm)
    bottom_gap: 100        # Saum über dem Boden (mm)
    overhang: 40           # Überstand der Stange je Pfostenende (mm)

surroundings:
  walls:
    # The pergola sits 29.5 cm IN FRONT of the BOARD WALL of a Blockbohlen (log-cabin)
    # garden house: horizontal boards 3 cm thick (-> wall thickness 30 mm, the
    # `size` y). It no longer touches the wall — it was pulled off so its house-side
    # roof edge (y = 2305) lands right at the bracket carrying the upper grey fascia
    # board (so that bracket stays as-is) rather than tucking under the eave.
    # MEASURED on site 2026-06-22: top of the upper grey fascia board = 245 cm (the
    # `height` below); underside of that board = underside of the garden-house rain
    # gutter = 222 cm. The lower grey board will be REMOVED, which frees the 10 cm
    # the pergola roof was raised by: the pergola's highest point (~2320 mm at the
    # house side) now passes the old 2220 mm gutter line and stops just under the
    # upper board.
    #
    # Length: the wall is only drawn as far as the pergola needs it. It ends 5 cm
    # past the pergola's right edge (pergola right = x 2400, so wall right = 2450),
    # but runs long to the LEFT (the steep-path side, x_min) where the beds and the
    # ramp sit against it. Left edge -500, right edge 2450 -> width 2950.
    - name: Hauswand
      at: [-500, 2600]  # min corner (x, y) — the roof's back edge stops 29.5 cm short of this
      size: [2950, 30]  # (x, y) footprint: 30 mm board thickness, ends 5 cm past pergola
      height: 2450      # measured: top of the upper grey fascia board (245 cm)
      board_height: 190 # the wall is built of horizontal Blockbohlen (log boards) — draw
                        # them lightly as a wood texture: one faint horizontal course line
                        # every 190 mm (the indicative visible board face; adjust to the
                        # real board height if known). The wall itself is shown in a soft
                        # off-white (blanc cassé), the lines only ganz leicht so they hint
                        # at the cladding without competing with the pergola.
    # The garden-house eave fascia — the TWO grey boards (Faszienbretter) of the
    # eave block, drawn ghosted GREY (kind: fascia) and set apart from the off-white
    # Blockbohlen wall, so you can see how the pergola tucks just under them. Both
    # boards are drawn at their FULL EXISTING height; on site only the LOWER board is
    # removed so the pergola can come up into that freed space and butt up right under
    # the UPPER board. Together they FLOAT at the roof edge from base z0 = 2220 (=
    # underside of the lower board / the gutter line, 222 cm) up to 2450 (measured top
    # of the upper board, 245 cm). The boundary between the two boards is the pergola's
    # highest point (2320 mm): the lower board 2220 -> 2320, the upper board 2320 ->
    # 2450 — so the pergola's top lands exactly at the board joint, just under the
    # upper board, in the space the removed lower board used to occupy. In y both
    # project from the wall front face (2600) out toward the pergola by 29.5 cm, so
    # their outer face (y = 2305) lands at the pergola's house-side roof edge / the
    # holding bracket. In x they run the same length as the wall. (Modelled level for
    # simplicity — the real boards follow the garden-house roof pitch.)
    - name: Fasziabrett (unten)
      kind: fascia      # grey eave board, drawn apart from the off-white Blockbohlen wall
      at: [-500, 2305]  # min corner (x, y): outer (pergola-side) face 29.5 cm off the wall
      z0: 2220          # base: underside of the lower board = gutter line (222 cm)
      size: [2950, 295] # (x, y): runs the wall length; 29.5 cm deep back to the wall face
      height: 100       # 2220 -> 2320: lower board (removed on site; drawn for reference)
    - name: Fasziabrett (oben)
      kind: fascia
      at: [-500, 2305]
      z0: 2320          # base: the board joint = pergola's highest point (232 cm)
      size: [2950, 295]
      height: 130       # 2320 -> 2450: upper board (stays; pergola butts up under it)

  # A sloping path on the LEFT of the pergola, running along x. You walk down it
  # from the left: 1 m high at the far edge, tapering to ground level at the
  # pergola's left edge. 78 cm wide; it lies between the two beds, its back edge
  # 82 cm clear of the house wall (room for the 82 cm house-side bed). The three
  # strips together (82 + 78 + 100 cm) span the pergola's full 260 cm depth, and
  # the pergola abuts them at its left edge (x = 0) with no side overhang.
  paths:
    - name: Pfad
      at: [-1500, 1000]
      size: [1500, 780]   # (x length, y width = 78 cm)
      rise: 1000          # 1 m high at the high_end edge, 0 at the other
      high_end: x_min     # high on the far-left edge

  # Raised beds (60 cm) flanking the path, one on each side, over its length.
  # House-side bed 82 cm (runs right up to the house wall); outer bed 100 cm.
  beds:
    - name: Beet
      at: [-1500, 0]      # outer bed, in front of the path (y 0 .. 1.00 m)
      size: [1500, 1000]  # 100 cm wide
      height: 600
    - name: Beet
      at: [-1500, 1780]   # house-side bed (y 1.78 .. 2.60 m, against the wall)
      size: [1500, 820]   # 82 cm wide
      height: 600

ground:
  origin: [-1800, -1200]   # min corner of the drawn ground area
  extent: [7000, 5000]     # (x, y) size of the drawn ground area
